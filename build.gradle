plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.142'
}

version = mod_version
group = mod_group
base.archivesName = mod_id

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = neo_version

    parchment {
        minecraftVersion = parchment_minecraft_version
        mappingsVersion = parchment_mappings_version
    }

    runs {
        client {
            client()
            gameDirectory = file('run')
        }
        server {
            server()
            gameDirectory = file('run-server')
        }
    }

    mods {
        modernframes {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Bundled WebP decoder (pure Java, BSD-3-Clause), embedded into the mod jar through JarJar.
    // JarJar only embeds the artifacts listed here, so the whole TwelveMonkeys module set is
    // declared explicitly instead of relying on transitive resolution.
    jarJar(implementation('com.twelvemonkeys.imageio:imageio-webp:3.15.3')) {
        version {
            strictly '[3.15.0, 3.16.0)'
            prefer '3.15.3'
        }
    }
    jarJar(implementation('com.twelvemonkeys.imageio:imageio-core:3.15.3')) {
        version {
            strictly '[3.15.0, 3.16.0)'
            prefer '3.15.3'
        }
    }
    jarJar(implementation('com.twelvemonkeys.imageio:imageio-metadata:3.15.3')) {
        version {
            strictly '[3.15.0, 3.16.0)'
            prefer '3.15.3'
        }
    }
    jarJar(implementation('com.twelvemonkeys.common:common-lang:3.15.3')) {
        version {
            strictly '[3.15.0, 3.16.0)'
            prefer '3.15.3'
        }
    }
    jarJar(implementation('com.twelvemonkeys.common:common-io:3.15.3')) {
        version {
            strictly '[3.15.0, 3.16.0)'
            prefer '3.15.3'
        }
    }
    jarJar(implementation('com.twelvemonkeys.common:common-image:3.15.3')) {
        version {
            strictly '[3.15.0, 3.16.0)'
            prefer '3.15.3'
        }
    }
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
        minecraft_version        : minecraft_version,
        minecraft_version_range  : minecraft_version_range,
        neo_version              : neo_version,
        neo_version_range        : neo_version_range,
        loader_version_range     : loader_version_range,
        mod_id                   : mod_id,
        mod_name                 : mod_name,
        mod_license              : mod_license,
        mod_version              : mod_version,
        mod_authors              : mod_authors,
        mod_description          : mod_description,
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}
